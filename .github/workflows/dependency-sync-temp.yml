name: Temporary dependency sync
on:
  push:
    branches:
      - chatgpt/full-project-upgrade-20261005
permissions:
  contents: write
jobs:
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/full-project-upgrade-20261005
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install web-push@^3.6.7 --save
      - name: Commit dependency lock
        run: |
          if git diff --quiet -- package.json package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Add Web Push dependency"
          git push origin HEAD:chatgpt/full-project-upgrade-20261005
