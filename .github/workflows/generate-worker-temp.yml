name: Temporary worker bundle sync
on:
  push:
    branches:
      - chatgpt/full-project-upgrade-20261005
permissions:
  contents: write
jobs:
  sync-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/full-project-upgrade-20261005
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run worker:bundle
      - name: Commit generated worker if changed
        run: |
          if git diff --quiet -- supabase/functions/market-snapshot/index.js supabase/functions/market-snapshot/deno.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/market-snapshot/index.js supabase/functions/market-snapshot/deno.json
          git commit -m "Regenerate market snapshot worker"
          git push origin HEAD:chatgpt/full-project-upgrade-20261005
