name: Market snapshot ingestion
on:
  workflow_dispatch:
concurrency:
  group: market-snapshot-ingestion
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collect market and holder snapshots (no deployment)
        run: npm run market:ingest
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          SOLANA_TRAFFIC_RPC_URLS: ${{ secrets.SOLANA_TRAFFIC_RPC_URLS }}
          SOLANA_HOLDER_RPC_URLS: ${{ secrets.SOLANA_HOLDER_RPC_URLS }}
          MARKET_HOLDER_BUDGET: '2'
