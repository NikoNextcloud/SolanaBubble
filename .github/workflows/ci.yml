name: CI
permissions:
  contents: read

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1

on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run security:audit
      - run: npm run typecheck
      - run: npm test
      - run: npm run worker:check
      - run: npm run check:budgets
      - name: Build (with dummy env so build doesn't fail on missing vars)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          ADMIN_SECRET: placeholder
          NEXT_PUBLIC_BROWSER_SMOKE: "1"
      - run: npm run test:api
      - name: Browser smoke (mobile + desktop)
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          ADMIN_SECRET: placeholder
          NEXT_PUBLIC_BROWSER_SMOKE: "1"
        run: |
          set -euo pipefail
          npm run start -- -H 127.0.0.1 -p 3000 > /tmp/solanabubble-next.log 2>&1 &
          APP_PID=$!
          CHROME_PID=""
          trap 'kill ${CHROME_PID:-} ${APP_PID:-} 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then break; fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then cat /tmp/solanabubble-next.log; exit 1; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000 >/dev/null

          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME_BIN"
          CHROME_PROFILE=/tmp/solanabubble-chrome
          rm -rf "$CHROME_PROFILE"
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --remote-debugging-address=127.0.0.1 --remote-debugging-port=0 --user-data-dir="$CHROME_PROFILE" about:blank > /tmp/solanabubble-chrome.log 2>&1 &
          CHROME_PID=$!

          for i in $(seq 1 100); do
            if [ -s "$CHROME_PROFILE/DevToolsActivePort" ]; then break; fi
            if ! kill -0 "$CHROME_PID" 2>/dev/null; then cat /tmp/solanabubble-chrome.log; exit 1; fi
            sleep 0.2
          done
          if [ ! -s "$CHROME_PROFILE/DevToolsActivePort" ]; then
            cat /tmp/solanabubble-chrome.log
            exit 1
          fi
          CHROME_PORT="$(head -n 1 "$CHROME_PROFILE/DevToolsActivePort")"
          curl -fsS "http://127.0.0.1:${CHROME_PORT}/json/version" >/dev/null
          CHROME_DEBUG_URL="http://127.0.0.1:${CHROME_PORT}" node tests/browser-smoke.mjs
      - name: Upload browser smoke screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-smoke-screenshots
          path: |
            /tmp/solanabubble-mobile.png
            /tmp/solanabubble-desktop.png
            /tmp/solanabubble-live-impulses.png
          if-no-files-found: ignore
