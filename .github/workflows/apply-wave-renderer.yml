name: Apply reviewed wave renderer
on:
  push:
    branches: [fix/continuous-wave-renderer-20261009]
    paths: [scripts/apply_wave_renderer.py, .github/workflows/apply-wave-renderer.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.ref == 'refs/heads/fix/continuous-wave-renderer-20261009'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Apply guarded source transformations
        run: python3 scripts/apply_wave_renderer.py
      - name: Commit generated source and remove one-shot installer
        run: |
          git config user.name 'SolanaBubble automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/MarketMap.tsx components/MarketWaveMap.tsx components/MarketWaveMap.module.css tests/mobile-workspace.test.ts tests/fixtures/flow-trajectory-browser.mjs tests/browser-smoke.mjs README.md CHANGELOG.md scripts/apply_wave_renderer.py .github/workflows/apply-wave-renderer.yml
          git commit -m "fix: integrate continuous GOOD/EARLY renderer and honest motion controls"
          git push origin HEAD:fix/continuous-wave-renderer-20261009
